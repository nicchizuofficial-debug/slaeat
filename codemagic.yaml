workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - slaeat
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.nicchizu.slaeatapp
    scripts:
      - name: Create secrets.dart
        script: |
          echo "const String hotpepperApiKey = '$HOTPEPPER_API_KEY';" > lib/secrets.dart
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing settings on Xcode project
        script: |
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          security cms -D -i "$PROFILE_PATH" > /tmp/decoded_profile.plist
          PROFILE_UUID=$(python3 -c "import plistlib; print(plistlib.load(open('/tmp/decoded_profile.plist','rb'))['UUID'])")
          echo "Profile UUID: $PROFILE_UUID"
          python3 -c "c=open('ios/Runner.xcodeproj/project.pbxproj').read(); c=c.replace('CODE_SIGN_STYLE = Automatic;','CODE_SIGN_STYLE = Manual;'); open('ios/Runner.xcodeproj/project.pbxproj','w').write(c); print('Manual signing set')"
          python3 -c "import plistlib; ep={'method':'app-store','teamID':'8736NCW3K4','signingStyle':'manual','provisioningProfiles':{'jp.nicchizu.slaeatapp':'$PROFILE_UUID'}}; plistlib.dump(ep,open('/tmp/ExportOptions.plist','wb')); print('ExportOptions created')"
      - name: Flutter build ipa
        script: |
          flutter build ipa --release --export-options-plist=/tmp/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - mt166431@gmail.com
