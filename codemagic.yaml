workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - slaeat
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.nicchizu.slaeatapp
    scripts:
      - name: Create secrets.dart
        script: |
          echo "const String hotpepperApiKey = '$HOTPEPPER_API_KEY';" > lib/secrets.dart
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing settings on Xcode project
        script: |
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          security cms -D -i "$PROFILE_PATH" > /tmp/decoded_profile.plist

          python3 - << 'PYEOF'
import plistlib

with open('/tmp/decoded_profile.plist', 'rb') as f:
    profile = plistlib.load(f)

uuid = profile['UUID']
name = profile.get('Name', '')
print(f'Profile UUID: {uuid}')
print(f'Profile Name: {name}')

# Switch Xcode project to manual signing
with open('ios/Runner.xcodeproj/project.pbxproj', 'r') as f:
    content = f.read()
content = content.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
with open('ios/Runner.xcodeproj/project.pbxproj', 'w') as f:
    f.write(content)
print('Switched to manual signing')

# Create ExportOptions.plist
export_options = {
    'method': 'app-store',
    'teamID': '8736NCW3K4',
    'signingStyle': 'manual',
    'provisioningProfiles': {
        'jp.nicchizu.slaeatapp': uuid
    }
}
with open('/tmp/ExportOptions.plist', 'wb') as f:
    plistlib.dump(export_options, f)
print('ExportOptions.plist created')
PYEOF
      - name: Flutter build ipa
        script: |
          flutter build ipa --release --export-options-plist=/tmp/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - mt166431@gmail.com
