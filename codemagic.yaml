workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - slaeat
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.nicchizu.slaeatapp
    scripts:
      - name: Create secrets.dart
        script: |
          echo "const String hotpepperApiKey = '$HOTPEPPER_API_KEY';" > lib/secrets.dart
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Debug profile contents
        script: |
          for p in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "=== Profile: $p ==="
            strings "$p" | grep -E "jp\.|Name|AppID|slaeat" | head -20
          done
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --xcode-project ios/Runner.xcodeproj
      - name: Flutter build ipa
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - mt166431@gmail.com
